version: 2
updates:
  # Jena and SIS versions are Dockerfile ARGs, which Dependabot doesn't update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
